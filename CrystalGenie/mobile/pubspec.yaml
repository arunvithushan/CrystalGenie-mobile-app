name: crystal_genie
description: Crystal Genie — AI-powered gemstone identification.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"  # Flutter 3.27 or newer

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  file_picker: ^10.0.0
  image_cropper: ^8.0.2
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/test/
    # Optional: drop Montserrat / Playfair Display .ttf files here to bundle the fonts
    # (google_fonts picks them up automatically and no download is needed at runtime).
    - assets/google_fonts/
